name: Error
description: Algo no funciona como dice la spec
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Si es un problema de **seguridad**, no abras un issue: usa *Report a vulnerability* (ver SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué debería pasar
      description: Si puedes, indica la spec y el criterio de aceptación (p. ej. CA-003-02)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      multiple: true
      options: [iOS, Android, Web de pruebas]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la app y del sistema
      placeholder: "0.3.0 (42) · iOS 18.5 · iPhone 13"
  - type: checkboxes
    id: a11y
    attributes:
      label: Contexto
      options:
        - label: Con lector de pantalla u otra tecnología de accesibilidad activa
        - label: Con "reducir movimiento" o texto grande activados
        - label: Sin conexión (modo avión)
