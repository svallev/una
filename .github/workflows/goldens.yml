# Genera los goldens en Linux (el mismo entorno en el que CI los compara).
# Se lanza al poner la etiqueta "actualizar-goldens" en una PR; las imágenes se
# descargan del artefacto, se revisan y se suben en un commit normal.
# Sin permisos de escritura: el workflow nunca modifica el repositorio.
name: Goldens

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  update:
    name: Generar goldens (Linux)
    if: github.event.label.name == 'actualizar-goldens'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Flutter (versión de .fvmrc)
        working-directory: .
        run: bash tools/install-flutter.sh && echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      # Como en ci.yml: `dart run` de un script ejecuta los hooks de los paquetes
      # nativos (PDFium de pdfrx); sin este paso, los goldens del PDF no lo
      # encuentran. (`build_runner` compila aparte y no los ejecuta.)
      - run: dart run tool/check_licenses.dart
      - run: flutter test --update-goldens --tags golden
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: app/test/goldens/goldens/
          if-no-files-found: error
          retention-days: 7
