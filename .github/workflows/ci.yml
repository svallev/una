name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentación y tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar design/tokens.json (estructura y contraste AA)
        run: node tools/validate-tokens.mjs
      - name: Validar JSON del repo
        run: |
          find . -name '*.json' -not -path './node_modules/*' -not -path './app/build/*' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))'

  detect:
    name: ¿Existe la app?
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f app/pubspec.yaml ]; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

  flutter:
    name: Flutter · format, analyze, test, web
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Flutter (versión de .fvmrc)
        working-directory: .
        run: bash tools/install-flutter.sh && echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - name: Licencias de las dependencias (threat-model §5)
        run: dart run tool/check_licenses.dart
      - name: Código generado al día (drift, l10n, identidad, tokens, textos nativos, esquema)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart run tool/gen_identity.dart --check
          dart run tool/gen_tokens.dart --check
          dart run tool/gen_android_strings.dart --check
          git diff --exit-code || (echo "::error::Hay código generado sin actualizar" && exit 1)
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - name: Tests (unitarios, widgets, goldens, migraciones, l10n, tokens)
        run: flutter test --coverage
      - name: Diferencias de los goldens (si fallan)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goldens-diferencias
          path: app/test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 7
      - run: flutter build web --release --wasm --no-web-resources-cdn

  android:
    name: Android · build debug y release
    needs: [detect, flutter]
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: bash tools/install-flutter.sh && echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug
          flutter build apk --release --split-per-abi
      - name: Wrapper de Gradle verificado (distributionSha256Sum y gradle-wrapper.jar; CA-020-14, P-020-2)
        # Tras compilar: el gradle-wrapper.jar no está en el repositorio, lo copia Flutter de su caché
        # al compilar. Falla si falta la suma (p. ej. tras una actualización de Flutter, CL-020-18),
        # si no es la de tools/gradle-wrapper.lock o si el jar no es uno de los que publica Gradle.
        run: bash tools/check-gradle-wrapper.sh
      - name: Permisos del manifiesto combinado (release sin permisos; debug solo los esperados)
        working-directory: app
        run: |
          bash ../tools/check-android-permissions.sh release
          bash ../tools/check-android-permissions.sh debug
      - name: Manifiestos negativos de permisos y componentes (CA-020-13)
        # Cada manifiesto de tools/fixtures/manifests/ (un permiso, un -sdk-23, un -sdk-m, un segundo
        # filtro, un <data>, BROWSABLE, DEFAULT, una acción de más…) tiene que hacer fallar el script.
        run: bash tools/check-android-permissions.sh --negative
      - name: Pruebas JVM del núcleo de notificaciones (spec 019, P-019-1)
        # JUnit 4.13.2 es solo `testImplementation`: corre el Kotlin real (horas, despertares, orquestador)
        # con puertos falsos, sin emulador. Tras `flutter build`, que deja resuelto el proyecto Gradle.
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest
      - name: El APK de release no lleva JUnit ni Hamcrest (spec 019, C-2; threat-model §5)
        # EPL-1.0 no está en la lista de §5: se acepta solo porque no se distribuye. El de debug lleva el
        # plugin integration_test, que referencia org.junit sin empaquetarlo, y por eso no se comprueba.
        working-directory: app
        run: bash ../tools/check-apk-no-test-classes.sh build/app/outputs/flutter-apk/app-*-release.apk
      - name: PDFium fijado (tools/pdfium.lock, threat-model §5)
        working-directory: app
        run: bash ../tools/check-pdfium.sh
      - name: Licencias completas y archivo de avisos (spec 015, CA-015-14b; ADR-0026; threat-model §5)
        working-directory: app
        # Tras compilar: usa la caché de Gradle (--offline) y lo que ya está instalado; no instala nada.
        # Emite app/build/third-party-notices.txt del APK de release comprobado y lo verifica ya emitido.
        run: bash ../tools/check-licenses.sh
      - name: Archivo de avisos de terceros (el que se publica en la web; caduca a los 90 días)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: app/build/third-party-notices.txt
          if-no-files-found: error
          retention-days: 90
      - name: El archivo de avisos falla si le quitas una entrada o el cuerpo de un texto (negativo)
        working-directory: app
        # Muta copias en memoria del archivo emitido (un paquete de Dart, un .so, un artefacto de
        # Android, unas fuentes, el cuerpo de un .txt o de un OFL) y exige que cada una falle y nombre
        # la entrada; si alguna pasa, este paso falla.
        run: bash ../tools/check-licenses.sh --negative
      - name: Tamaño de descarga (< 25 MB por ABI)
        working-directory: app
        # Las librerías nativas van sin comprimir dentro del APK (extractNativeLibs=false);
        # la tienda descarga comprimido. Se mide el APK comprimido (gzip -9), que se
        # parece a la descarga real (spec 008: con PDFium, ~12,7 MB en arm64 frente a
        # 27 MB del archivo).
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            raw=$(stat -c %s "$apk")
            size=$(gzip -9 -c "$apk" | wc -c)
            echo "$apk: $((raw / 1024 / 1024)) MB en disco, $((size / 1024 / 1024)) MB comprimido"
            [ "$size" -lt $((25 * 1024 * 1024)) ] || { echo "::error::$apk supera 25 MB comprimido"; exit 1; }
          done

  ios:
    name: iOS · build sin firmar
    needs: [detect, flutter]
    if: needs.detect.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/install-flutter.sh && echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --debug --no-codesign
