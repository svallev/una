name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentación y tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar design/tokens.json (estructura y contraste AA)
        run: node tools/validate-tokens.mjs
      - name: Validar JSON del repo
        run: |
          find . -name '*.json' -not -path './node_modules/*' -not -path './app/build/*' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))'

  detect:
    name: ¿Hay que compilar?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # En una PR el checkout es el commit de fusión: HEAD^1 es la punta de la rama base.
          fetch-depth: 2
      - id: check
        # La lógica vive en tools/ci-detect.sh (con su test, app/test/tool/ci_detect_test.dart):
        # `build` = compilar y probar la app; `web` = construir y comprobar la web y la ficha
        # (CA-023-18). Va a nivel de job (`if:` de los trabajos) y no con `paths:` en `on:`: un job
        # saltado cuenta como superado para las comprobaciones obligatorias; un workflow que no
        # arranca las deja pendientes. En main se compila y se construye siempre. Falla cerrada: si
        # `git diff` falla, el paso falla (va en su propio comando, no en una sustitución de proceso),
        # y una lista vacía en una PR lo da todo.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files"
          : > "$changed"
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only -z HEAD^1 HEAD > "$changed"
          fi
          result="$(bash tools/ci-detect.sh --event "$EVENT" < "$changed")"
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter · format, analyze, test, web
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Flutter (versión de .fvmrc)
        working-directory: .
        run: bash tools/install-flutter.sh && echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - name: Licencias de las dependencias (threat-model §5)
        run: dart run tool/check_licenses.dart
      - name: Código generado al día (drift, l10n, identidad, tokens, textos nativos, esquema)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart run tool/gen_identity.dart --check
          dart run tool/gen_tokens.dart --check
          dart run tool/gen_android_strings.dart --check
          git diff --exit-code || (echo "::error::Hay código generado sin actualizar" && exit 1)
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - name: Tests (unitarios, widgets, goldens, migraciones, l10n, tokens)
        run: flutter test --coverage
      - name: Diferencias de los goldens (si fallan)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens-diferencias
          path: app/test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 7
      - run: flutter build web --release --wasm --no-web-resources-cdn

  android:
    name: Android · build debug y release
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: bash tools/install-flutter.sh && echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug
          flutter build apk --release --split-per-abi
      - name: Wrapper de Gradle verificado (distributionSha256Sum y gradle-wrapper.jar; CA-020-14, P-020-2)
        # Tras compilar: el gradle-wrapper.jar no está en el repositorio, lo copia Flutter de su caché
        # al compilar. Falla si falta la suma (p. ej. tras una actualización de Flutter, CL-020-18),
        # si no es la de tools/gradle-wrapper.lock o si el jar no es uno de los que publica Gradle.
        run: bash tools/check-gradle-wrapper.sh
      - name: Permisos del manifiesto combinado (release sin permisos; debug solo los esperados)
        working-directory: app
        run: |
          bash ../tools/check-android-permissions.sh release
          bash ../tools/check-android-permissions.sh debug
      - name: Manifiestos negativos de permisos y componentes (CA-020-13)
        # Cada manifiesto de tools/fixtures/manifests/ (un permiso, un -sdk-23, un -sdk-m, un segundo
        # filtro, un <data>, BROWSABLE, DEFAULT, una acción de más…) tiene que hacer fallar el script.
        run: bash tools/check-android-permissions.sh --negative
      - name: Estática MASTG de los APK de release (spec 020, CA-020-22)
        # Sobre lo compilado, no sobre el código: sin depurable ni tráfico en claro (a, b), reglas de
        # copia y transferencia exactas (c), proveedores y rutas de archivos (d), minSdk 26 y targetSdk
        # >= el de Google Play (e), ni claves ni archivos de firma dentro (f) y los ajustes de
        # privacidad de hoy (g) y ninguna ruta de una carpeta personal de quien compila (build-paths,
        # CA-023-19; el runner es /home/runner). No depende de la identidad: los marcadores siguen
        # siendo normales. Las excepciones de (f) y build-paths: tools/release/secret-allowlist.txt.
        run: bash tools/check-package.sh
      - name: Pruebas JVM del núcleo de notificaciones (spec 019, P-019-1)
        # JUnit 4.13.2 es solo `testImplementation`: corre el Kotlin real (horas, despertares, orquestador)
        # con puertos falsos, sin emulador. Tras `flutter build`, que deja resuelto el proyecto Gradle.
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest
      - name: El APK de release no lleva JUnit ni Hamcrest (spec 019, C-2; threat-model §5)
        # EPL-1.0 no está en la lista de §5: se acepta solo porque no se distribuye. El de debug lleva el
        # plugin integration_test, que referencia org.junit sin empaquetarlo, y por eso no se comprueba.
        working-directory: app
        run: bash ../tools/check-apk-no-test-classes.sh build/app/outputs/flutter-apk/app-*-release.apk
      - name: El APK de release trae recursos en catalán, español e inglés (spec 024, CA-024-04)
        # Sin values-ca, con `ca-ES, en-US` Android pone el inglés delante y la app sale en inglés
        # (H-022-10). El APK de debug no vale (trae `ca` de librerías); el de release solo conserva
        # los recursos que la app usa. Mismo aapt2 que `check-package.sh`; sin red.
        working-directory: app
        run: bash ../tools/check-apk-locales.sh build/app/outputs/flutter-apk/app-*-release.apk
      - name: PDFium fijado (tools/pdfium.lock, threat-model §5)
        working-directory: app
        run: bash ../tools/check-pdfium.sh
      - name: Licencias completas y archivo de avisos (spec 015, CA-015-14b; ADR-0026; threat-model §5)
        working-directory: app
        # Tras compilar: usa la caché de Gradle (--offline) y lo que ya está instalado; no instala nada.
        # Emite app/build/third-party-notices.txt del APK de release comprobado y lo verifica ya emitido.
        run: bash ../tools/check-licenses.sh
      - name: Archivo de avisos de terceros (el que se publica en la web; caduca a los 90 días)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: app/build/third-party-notices.txt
          if-no-files-found: error
          retention-days: 90
      - name: El archivo de avisos falla si le quitas una entrada o el cuerpo de un texto (negativo)
        working-directory: app
        # Muta copias en memoria del archivo emitido (un paquete de Dart, un .so, un artefacto de
        # Android, unas fuentes, el cuerpo de un .txt o de un OFL) y exige que cada una falle y nombre
        # la entrada; si alguna pasa, este paso falla.
        run: bash ../tools/check-licenses.sh --negative
      - name: Tamaño de descarga (< 20 MB por ABI)
        # El mismo script que usa el trabajo de publicación (spec 020, CA-020-02): mide cada APK de
        # release ya comprimido, que se parece a la descarga real, y falla cerrado sin APK.
        run: bash tools/check-size.sh

  ios:
    name: iOS · build sin firmar
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/install-flutter.sh && echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --debug --no-codesign

  web:
    name: Web y ficha
    # Solo la web y la ficha de tienda (CA-023-18): construir, comprobar y probar. Sin despliegue, sin
    # secretos y sin tocar la app; el proyecto de Vercel y el dominio llegan en F6.
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir la web
        run: node landing/build.mjs
      - name: Comprobar la web (HTML, contraste, enlaces, textos, dist al día)
        run: node landing/check.mjs
      - name: Tests de Node (web y ficha)
        # Los archivos van con el glob de la shell: en Node 24 `node --test landing/test` falla. Falla
        # cerrada: si la salida no trae el recuento, o es menor que el mínimo, el paso falla (un glob
        # que no encuentra nada o un reportero que cambia de forma no pueden dar un «0 tests, bien»). El
        # reportero `tap` fija el formato del recuento (`# tests N`; hoy 508). El mínimo no es una cifra
        # exacta, solo el suelo que prueba que se ejecutó la batería.
        run: |
          set -euo pipefail
          min=100
          node --test --test-reporter=tap landing/test/*.test.mjs store/google-play/test/*.test.mjs | tee "$RUNNER_TEMP/node-tests.txt"
          n="$(sed -nE 's/^# tests ([0-9]+)$/\1/p' "$RUNNER_TEMP/node-tests.txt" | tail -n 1)"
          if [ -z "$n" ] || [ "$n" -lt "$min" ]; then
            echo "::error::Se esperaban al menos $min tests de Node y se contaron '${n:-ninguno}'"
            exit 1
          fi
          echo "Tests de Node: $n (mínimo $min)"
      - name: Comprobar la ficha de Google Play (permisos, textos y gráficos)
        run: node store/google-play/check.mjs
