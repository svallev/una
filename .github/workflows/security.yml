name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # lunes 05:17 UTC

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # [F2] Añadir java-kotlin y swift (macos-latest) cuando haya código nativo en app/android y app/ios.
        # Dart no está soportado por CodeQL: lo cubren `flutter analyze` (CI) y OSV-Scanner.
        language: [actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # pub.dev publica las licencias en minúsculas ("bsd-3-clause") y la acción
          # las rechaza como SPDX no válido. Las licencias las comprueba CI con
          # app/tool/check_licenses.dart (threat-model §5); aquí solo vulnerabilidades.
          license-check: false
          comment-summary-in-pr: on-failure

  detect:
    runs-on: ubuntu-latest
    outputs:
      lock: ${{ steps.check.outputs.lock }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: if [ -f app/pubspec.lock ]; then echo "lock=true" >> "$GITHUB_OUTPUT"; else echo "lock=false" >> "$GITHUB_OUTPUT"; fi

  osv-pr:
    name: OSV-Scanner (PR)
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.lock == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

  osv-main:
    name: OSV-Scanner (main y semanal)
    needs: detect
    if: github.event_name != 'pull_request' && needs.detect.outputs.lock == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

# Secret scanning + push protection: se activan en Settings → Code security (gratis en repos públicos); no requieren workflow.
