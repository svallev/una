# Sumas del wrapper de Gradle (spec 020, CA-020-14; threat-model §5). Las comprueba
# tools/check-gradle-wrapper.sh, que falla si cambia algo.
#
# Fuente: las sumas SHA-256 que publica Gradle, en https://gradle.org/release-checksums/ y en
# https://services.gradle.org/distributions/<archivo>.sha256. Comprobadas el 2026-10-14 (las dos
# fuentes dan lo mismo en las tres líneas de abajo).
#
# distribution <archivo del distributionUrl> <sha256>
#   La suma que tiene que llevar distributionSha256Sum en
#   app/android/gradle/wrapper/gradle-wrapper.properties. Gradle comprueba la distribución con ella
#   al descargarla (no al reutilizar una ya instalada en ~/.gradle).
# wrapper-jar <versión de Gradle que lo publica> <sha256>
#   Las sumas admitidas del gradle-wrapper.jar que se ejecuta. El jar no está en el repositorio
#   (app/android/.gitignore): la herramienta de Flutter lo copia de su caché
#   (bin/cache/artifacts/gradle_wrapper) al compilar, y el de Flutter 3.47.5 es el jar publicado con
#   Gradle 2.10 (su MANIFEST.MF dice Implementation-Version 2.10; no cambia con distributionUrl).
#   La comprobación corre después de compilar y detecta un jar alterado, no impide que se haya
#   ejecutado ya (P-020-2, threat-model §5).
#
# Al subir de versión de Gradle o de Flutter: repite la comprobación en las dos fuentes y actualiza
# este archivo y el distributionSha256Sum en la misma PR (la CI falla mientras no coincidan: CL-020-18).
