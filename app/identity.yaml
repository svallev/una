# Fuente ÚNICA de la identidad de la app (constitución P7). No escribas el nombre en ningún otro sitio.
# Tras cambiarlo: `dart run tool/gen_identity.dart` (CI comprueba que lo generado está al día).
#
# [Pendiente PD-2] El identificador (bundle ID / applicationId) NO está aquí a propósito: es permanente
# y se fija una sola vez al comprar el dominio neutro (ADR y android/app/build.gradle.kts).
displayName: "Una."   # nombre bajo el icono y en el sistema
wordmark: "una."      # logotipo dentro de la app

# Direcciones de las tres webs (spec 012, CA-012-04/05; spec 015, CA-015-13a/13b): una sola de cada una
# para ES y EN, sin `?` ni `#`. Se abren en el navegador del sistema, nunca dentro de la app. Solo
# `https`, y las tres tienen que ser distintas entre sí.
# [Pendiente PD-2] MARCADORES: las webs aún no existen. `tools/check-release-config.sh` impide publicar
# con un dominio reservado (example.com…) o con dos direcciones iguales; cámbialas por las definitivas
# cuando existan (y que coincidan con las de la ficha de la tienda).
privacyPolicyUrl: "https://example.com/privacy"        # política de privacidad
thirdPartyLicensesUrl: "https://example.com/licenses"  # licencias de terceros (ADR-0026)
helpUrl: "https://example.com/help"                    # ayuda
